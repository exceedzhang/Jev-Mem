name: Tests and source distribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 15432:5432
        health-check:
          test: ["CMD-SHELL", "pg_isready -U postgres"]
          timeout: 30s
          interval: 5s
    env:
      USE_TF: "0"
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      # PG-gated tests run against the service container above; the file-mode
      # suite ignores this variable.
      JEV_MEM_PG_DSN: postgresql://postgres:postgres@localhost:15432/jev_mem_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Create the Postgres test database
        run: >-
          python -c "import psycopg;
          conn = psycopg.connect('postgresql://postgres:postgres@localhost:15432/postgres', autocommit=True);
          conn.execute('CREATE DATABASE jev_mem_test');
          conn.close()"
      - run: python -m pytest -q
      - run: python scripts/check_public_release.py --tracked
      - run: python -m build

  test-macos:
    runs-on: macos-latest
    env:
      USE_TF: "0"
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/check_public_release.py --tracked
      - run: python -m build
