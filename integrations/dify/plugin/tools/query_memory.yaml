identity:
  name: query_memory
  author: exceedzhang
  label:
    en_US: Query Memory
    zh_Hans: 查询记忆
description:
  human:
    en_US: Retrieve relevant long-term memories from the Jev-Mem graph memory and synthesize an answer.
    zh_Hans: 从 Jev-Mem 图记忆中检索相关长期记忆并合成答案。
  llm: Query the agent's long-term memory (Jev-Mem). Use this when the user asks about previously stored facts, preferences, past events, or relationships that span sessions. Returns the best-supported answer plus retrieval evidence and a compact retrieval trace.
parameters:
  - name: question
    type: string
    required: true
    label:
      en_US: Question
      zh_Hans: 问题
    human_description:
      en_US: The question to answer from long-term memory
      zh_Hans: 要从长期记忆中回答的问题
    llm_description: The question to answer from long-term memory.
    form: llm
  - name: top_k
    type: number
    required: false
    default: 15
    label:
      en_US: Top K
      zh_Hans: Top K
    human_description:
      en_US: Number of evidence items to retrieve
      zh_Hans: 检索返回的证据条数
    llm_description: Number of evidence items to retrieve (default 15).
    form: form
  - name: result_mode
    type: string
    required: false
    default: answer
    label:
      en_US: Result Mode
      zh_Hans: 返回模式
    human_description:
      en_US: Return the synthesized answer, or the raw memory records for your own model to process
      zh_Hans: 返回合成后的答案，或返回原始记忆记录供你自己的模型加工
    llm_description: Set answer (default) to get the memory service synthesized answer, or memory to get the raw retrieved memory records so the agent can combine them with its own context and instructions.
    form: form
  - name: response_format
    type: string
    required: false
    default: both
    label:
      en_US: Response Format
      zh_Hans: 返回格式
    human_description:
      en_US: Output format (text, json, or both)
      zh_Hans: 输出格式：text、json 或两者都返回
    llm_description: Output format can be text (plain text), json (structured object available as the tool json output variable), or both (default).
    form: form
extra:
  python:
    source: tools/query_memory.py
