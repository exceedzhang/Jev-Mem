    type: string
    required: true
    label:
      en_US: Memory ID
      zh_Hans: 记忆 ID
    human_description:
      en_US: The memory_id returned by ingest_memory
      zh_Hans: ingest_memory 返回的 memory_id
    llm_description: The memory_id of the memory to consolidate (returned by ingest_memory).
    form: llm
