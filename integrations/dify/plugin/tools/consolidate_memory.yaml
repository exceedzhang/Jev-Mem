    en_US: Run a non-destructive consolidation pass over one stored memory.
    zh_Hans: 对一条已存储记忆执行非破坏性巩固。
  llm: Run a Jev consolidation pass over one stored memory. Jev compares it against nearby memories for redundancy, contradiction, and obsolete status, and may add subtype links or an approved merged representation; raw evidence is never destroyed. Use after bulk ingestion to clean up the memory graph.
